{% extends "base.html" %}
{% block title %}修改密码 - 应急演练平台{% endblock %}
{% block page_title %}修改密码{% endblock %}

{% block content %}
<div class="card" style="max-width:520px;">
    <div class="card-header">
        <span><i class="bi bi-key"></i> 修改登录密码</span>
    </div>
    <div class="card-body">
        {% if error %}
        <div class="error-msg" style="background:var(--danger-bg);border:1px solid #fecaca;color:#DC2626;padding:10px 14px;border-radius:var(--radius-sm);font-size:.82rem;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
            <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
        </div>
        {% endif %}
        {% if success %}
        <div class="success-msg" style="background:var(--success-bg);border:1px solid #a7f3d0;color:#059669;padding:10px 14px;border-radius:var(--radius-sm);font-size:.82rem;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
            <i class="bi bi-check-circle-fill"></i> {{ success }}
        </div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label class="form-label"><i class="bi bi-person"></i> 当前账号</label>
                <input type="text" class="form-control" value="{{ user.username }}" disabled
                       style="background:var(--slate-50);color:var(--slate-500);">
            </div>
            <div class="form-group">
                <label class="form-label" for="old_password"><i class="bi bi-lock"></i> 原密码</label>
                <input type="password" id="old_password" name="old_password" class="form-control"
                       placeholder="请输入当前密码" required autocomplete="current-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="new_password"><i class="bi bi-shield-lock"></i> 新密码</label>
                <input type="password" id="new_password" name="new_password" class="form-control"
                       placeholder="至少6个字符" required minlength="6" autocomplete="new-password">
                <span class="form-hint">密码长度不能少于6位，建议使用字母、数字和符号的组合</span>
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm_password"><i class="bi bi-shield-check"></i> 确认新密码</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                       placeholder="再次输入新密码" required minlength="6" autocomplete="new-password">
            </div>
            <div style="display:flex;gap:var(--space-2);padding-top:8px;">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 修改密码</button>
                <button type="reset" class="btn btn-secondary">重置</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
